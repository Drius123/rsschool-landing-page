<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Menu | Coffee House</title>
	<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
	<script>
		document.documentElement.setAttribute(
			"data-theme",
			localStorage.getItem("coffee-house-theme") === "dark" ? "dark" : "light"
		);
	</script>
	<link rel="stylesheet" href="../assets/css/style.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header class="header">
		<div class="container">
			<div class="header__inner">
				<a href="../Main/index.html" class="logo" aria-label="Coffee House">
					<img class="logo__img logo__img--light" src="../assets/img/logo.svg" alt="" width="100" height="60">
					<img class="logo__img logo__img--dark" src="../assets/img/logo-dark.svg" alt="" width="100" height="60">
				</a>
				<nav class="nav" aria-label="Main">
					<ul class="nav__list">
						<li>
							<a href="../Main/index.html#favorite-coffee" class="nav__link">Favorite coffee</a>
						</li>
						<li>
							<a href="../Main/index.html#about" class="nav__link">About</a>
						</li>
						<li>
							<a href="../Main/index.html#mobile-app" class="nav__link">Mobile app</a>
						</li>
						<li>
							<a href="#footer" class="nav__link">Contact us</a>
						</li>
					</ul>
				</nav>
				<div class="header__actions">
					<button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark theme">

							<circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>

						</svg>
						<span class="theme-toggle__thumb"></span>
						<svg class="theme-toggle__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
							<path d="M13.2 10.2A5.2 5.2 0 0 1 5.8 2.8 5.3 5.3 0 1 0 13.2 10.2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</button>
					<a href="index.html" class="menu-link is-active" aria-current="page">
						Menu
						<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
							<path d="M14.166 9.767v1.9A5.833 5.833 0 1 1 2.5 11.667v-1.9c0-.332.268-.6.6-.6h10.466c.331 0 .6.268.6.6Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

							<path d="M13.334 9.167h2.083a2.083 2.083 0 1 1 0 4.166h-1.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</a>
					<button class="burger" type="button" aria-label="Open menu">
						<span></span>
					</button>
				</div>
			</div>
		</div>

	</main>
